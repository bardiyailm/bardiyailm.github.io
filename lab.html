function rot(){if(spin&&stage==='space'){const c=map.getCenter();map.jumpTo({center:[c.lng+.12,c.lat]})}
 if(stage==='space'){pulse+=.05;const k=(Math.sin(pulse)+1)/2;try{map.setPaintProperty('egy-fill','fill-color',k>.5?'#2ecc71':'#e74c3c');map.setPaintProperty('egy-fill','fill-opacity',.35+k*.3)}catch(e){}}

let school=null;
async function land(){const name=(document.getElementById('sn').value||'').trim();if(name.length<3){document.getElementById('sn').focus();return}
 stage='school';ui('الهبوط إلى '+name+'…');const c=map.getCenter();
 await fly({center:c,zoom:13.2,pitch:68,bearing:25,duration:4200});

 ui(name+' — محافظة '+gov,'<button class="ghost" id="up">العودة إلى الخريطة</button>');document.getElementById('up').onclick=leave;}
